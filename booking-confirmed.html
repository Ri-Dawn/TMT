<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0E">
<title>Confirmed · The Midnight Truth</title>
<link rel="icon" type="image/png" href="/desk-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0B0B0E;--gold:#C69A5C;--gold-soft:#E8CC9C;--bone:#F3EDE4;--bone-dim:#C9BFB0;--line:rgba(176,141,87,.22);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--ease:cubic-bezier(.16,.8,.24,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{min-height:100vh;min-height:100dvh;background:var(--ink);color:var(--bone);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .bg{position:fixed;inset:0;background:radial-gradient(900px 520px at 50% -8%,rgba(198,154,92,.14),transparent 62%),radial-gradient(700px 480px at 85% 110%,rgba(122,31,43,.16),transparent 60%);pointer-events:none}
  .shell{position:relative;max-width:560px;margin:0 auto;padding:clamp(28px,6vw,64px) 18px calc(140px + env(safe-area-inset-bottom))}
  .card{position:relative;padding:44px 28px 34px;border-radius:30px;text-align:center;background:linear-gradient(155deg,rgba(22,19,15,.82),rgba(10,9,8,.66) 55%,rgba(176,141,87,.07));border:1px solid rgba(243,237,228,.14);box-shadow:0 40px 90px -40px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);animation:rise .9s var(--ease) both}
  .ring{width:92px;height:92px;margin:0 auto 22px;position:relative}
  .ring::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(198,154,92,.32),transparent 66%);animation:breath 4.6s ease-in-out infinite}
  .ring img{position:relative;width:100%;height:100%;object-fit:contain;animation:turn 90s linear infinite}
  .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;font-weight:400}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,9vw,52px);line-height:1.06;letter-spacing:.005em}
  .quote{font-family:var(--serif);font-style:italic;font-weight:300;font-size:21px;color:var(--gold-soft);margin:14px 0 0}
  .rule{width:46px;height:1px;margin:26px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .lead{font-size:15.5px;line-height:1.75;color:var(--bone-dim);max-width:400px;margin:0 auto}
  .panel{margin:26px 0 0;text-align:left;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.03);overflow:hidden}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:15px 20px}
  .row+.row{border-top:1px solid rgba(176,141,87,.12)}
  .k{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim);opacity:.8;flex:none;font-weight:400}
  .v{font-family:var(--serif);font-size:21px;line-height:1.25;text-align:right;color:var(--bone)}
  .v small{display:block;font-family:var(--sans);font-size:12px;color:var(--bone-dim);margin-top:3px;font-weight:300}
  .code{display:inline-block;font-family:var(--sans);font-weight:500;letter-spacing:.16em;font-size:14px;color:var(--gold-soft)}
  .next{margin:30px 0 0}
  .next h2{font-family:var(--serif);font-weight:400;font-size:27px;margin-bottom:8px}
  .next p{font-size:14.5px;line-height:1.75;color:var(--bone-dim);max-width:390px;margin:0 auto 20px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:0 26px;border-radius:100px;font-family:var(--sans);font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.22);color:var(--ink);background:linear-gradient(155deg,var(--gold-soft),var(--gold));box-shadow:0 14px 34px -14px rgba(198,154,92,.6),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{color:var(--bone);background:linear-gradient(155deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border-color:rgba(243,237,228,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .duo .btn{min-height:50px;padding:0 12px;font-size:10.5px;letter-spacing:.14em}
  .note{margin-top:20px;font-size:12.5px;color:var(--bone-dim);opacity:.85;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;padding:12px 22px;border-radius:100px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--gold-soft);transition:all .45s var(--ease);pointer-events:none;z-index:9}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .rv{opacity:0;animation:rise .9s var(--ease) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes breath{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
  @keyframes turn{to{transform:rotate(360deg)}}
  .wait .ring img{animation:turn 14s linear infinite}
  @media (max-width:420px){.card{padding:38px 20px 28px}.row{padding:14px 16px}.v{font-size:19px}.duo{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1}}
</style>
</head>
<body>
<div class="bg"></div>
<main class="shell">
  <section class="card wait" id="card">
    <div class="ring"><img src="/mt-ring.png" alt=""></div>
    <div class="eyebrow" id="eyebrow">Confirming</div>
    <h1 id="title">One moment</h1>
    <p class="lead" id="lead" style="margin-top:18px">We are confirming your reservation. This only takes a few seconds.</p>
    <div id="out"></div>
  </section>
</main>
<div class="toast" id="toast">Copied</div>
<script>
(function () {
  var qs = new URLSearchParams(location.search), bid = qs.get('booking_id'), oid = qs.get('order_id');
  var $ = function (id) { return document.getElementById(id); };
  var IG = 'https://ig.me/m/midnighttruthco', MEET = 'https://meet.google.com/bct-sjzt-kov';
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || ''), inIndia = /Calcutta|Kolkata/.test(tz);
  var dFmt = function (iso, zone) { var d = new Date(iso), o = zone ? { timeZone: zone } : {}; return d.toLocaleDateString('en-GB', Object.assign({ weekday: 'long', day: 'numeric', month: 'long' }, o)) + ', ' + d.toLocaleTimeString('en-GB', Object.assign({ hour: 'numeric', minute: '2-digit', hour12: true }, o)).replace(' am', ' AM').replace(' pm', ' PM'); };
  var toast = function (m) { var t = $('toast'); t.textContent = m; t.className = 'toast on'; setTimeout(function () { t.className = 'toast'; }, 2200); };
  var copy = function (txt) { try { navigator.clipboard.writeText(txt).then(function () { toast('Code copied'); }, function () { toast('Your code: ' + txt); }); } catch (e) { toast('Your code: ' + txt); } };
  var rv = function (html, i) { return '<div class="rv" style="animation-delay:' + (i * 0.12) + 's">' + html + '</div>'; };
  var row = function (k, v, small) { return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + (small ? '<small>' + small + '</small>' : '') + '</span></div>'; };
  var home = '<a class="btn ghost" href="/">Return to The Midnight Truth</a>';

  function show(d) {
    $('card').className = 'card';
    if (d.kind === 'live') {
      $('eyebrow').textContent = 'Confirmed'; $('title').textContent = 'Your hour is held';
      $('lead').outerHTML = '<p class="quote" id="lead">The cards are waiting. So is the truth.</p>';
      var rows = row('Reading', esc(d.label), d.minutes + ' minutes') + row('When', esc(dFmt(d.start)), inIndia ? '' : 'India time · ' + esc(dFmt(d.start, 'Asia/Kolkata'))) + row('Reference', '<span class="code">' + esc(d.code) + '</span>');
      var end = new Date(new Date(d.start).getTime() + (d.minutes || 25) * 60000), z = function (x) { return x.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); };
      var cal = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('The Midnight Truth · ' + d.label) + '&dates=' + z(new Date(d.start)) + '/' + z(end) + '&details=' + encodeURIComponent('Your private reading. Reference ' + d.code);
      var step = d.mode === 'meet'
        ? '<h2>Your private room</h2><p>At your hour, join us here, audio only. You may wait a moment while we let you in.</p><a class="btn" href="' + MEET + '" target="_blank" rel="noopener">Open Google Meet</a>'
        : '<h2>One quiet last step</h2><p>Send us your reference on Instagram, so we know you are on your way. At your hour, we call you there.</p><button class="btn" id="ig" type="button">Copy my code and open Instagram</button>';
      $('out').innerHTML = '<div class="rule"></div>' + rv('<p class="lead">Your hour is set aside for you alone. Come as you are, with whatever is weighing on you, and we will sit with it together.</p>', 1) +
        rv('<div class="panel">' + rows + '</div>', 2) + rv('<div class="next">' + step + '</div>', 3) +
        rv('<div class="duo"><a class="btn ghost" href="' + cal + '" target="_blank" rel="noopener">Add to calendar</a><a class="btn ghost" href="/">Return home</a></div>', 4) +
        rv('<p class="note">' + (d.emailed ? 'We have also sent these details to your email. ' : '') + 'If this hour stops working, simply message us and we will find you another.</p>', 5);
      var b = $('ig'); if (b) b.addEventListener('click', function () { copy(d.code); window.open(IG, '_blank'); });
    } else {
      $('eyebrow').textContent = 'Received'; $('title').textContent = 'We have your question';
      $('lead').outerHTML = '<p class="quote" id="lead">We will sit with it carefully.</p>';
      var way = d.delivery === 'instagram' ? 'as a message on Instagram' : d.delivery === 'whatsapp' ? 'on WhatsApp' : 'by email';
      var where = d.delivery === 'instagram' ? 'On Instagram' : d.delivery === 'whatsapp' ? 'On WhatsApp' : 'In your inbox';
      var rows2 = row('Reading', esc(d.label)) + row('Arrives by', esc(dFmt(d.due)), (inIndia ? where : where + ' · India time ' + esc(dFmt(d.due, 'Asia/Kolkata')))) + row('Reference', '<span class="code">' + esc(d.code) + '</span>');
      $('out').innerHTML = '<div class="rule"></div>' + rv('<p class="lead">Thank you for trusting us with this. Your written reading will reach you ' + way + ' within 24 hours.</p>', 1) + rv('<div class="panel">' + rows2 + '</div>', 2) +
        rv('<p class="note">' + (d.emailed ? 'A note has been sent to your inbox. ' : '') + (d.delivery === 'email' || !d.delivery ? 'If it does not appear, please look in your spam or promotions folder.' : 'Please keep your messages open, so it reaches you easily.') + '</p>', 3) + rv('<div style="margin-top:22px">' + home + '</div>', 4);
    }
  }
  function lost() { $('card').className = 'card'; $('eyebrow').textContent = 'Not found'; $('title').textContent = 'We could not find that'; $('lead').textContent = 'If you were charged, your reservation is safe. Please message us on Instagram, @midnighttruthco, and we will help at once.'; $('out').innerHTML = '<div style="margin-top:26px">' + home + '</div>'; }
  var tries = 0;
  function load() {
    if (!bid && !oid) return lost();
    fetch('/api/booking?' + (bid ? 'id=' + encodeURIComponent(bid) : 'order=' + encodeURIComponent(oid))).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d) return lost();
      if (d.status === 'paid') return show(d);
      if (d.status === 'pending' && tries++ < 22) return setTimeout(load, 2000);
      if (d.status === 'pending') { $('card').className = 'card'; $('eyebrow').textContent = 'Almost there'; $('title').textContent = 'Still confirming'; $('lead').textContent = 'Your bank is taking a little longer. If you were charged, your reservation is safe, and your details will reach you shortly. You can also message us on Instagram, @midnighttruthco.'; $('out').innerHTML = '<div style="margin-top:26px">' + home + '</div>'; return; }
      lost();
    }).catch(function () { if (tries++ < 22) setTimeout(load, 2500); else lost(); });
  }
  load();
})();
</script>
</body>
</html>
